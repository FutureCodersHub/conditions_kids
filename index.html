<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeKids – Make Your Phone React!</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e17;
    --panel: #1a1930;
    --card: #22213a;
    --accent: #ff6b6b;
    --green: #6bff9e;
    --yellow: #ffe66d;
    --blue: #6bc5ff;
    --purple: #c77dff;
    --pink: #ff6bbf;
    --text: #fffffe;
    --muted: #a7a9be;
    --radius: 18px;
    --phone-w: 240px;
    --phone-h: 480px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Stars background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, #ffffff33 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 10%, #ffffff22 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 80%, #ffffff22 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 70%, #ffffff33 0%, transparent 100%),
      radial-gradient(2px 2px at 90% 60%, #ffffff11 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  header {
    text-align: center;
    padding: 32px 20px 16px;
    position: relative;
    z-index: 1;
  }

  .logo {
    font-size: 2.6rem;
    font-weight: 900;
    letter-spacing: -1px;
  }
  .logo span:nth-child(1) { color: var(--yellow); }
  .logo span:nth-child(2) { color: var(--green); }
  .logo span:nth-child(3) { color: var(--blue); }
  .logo span:nth-child(4) { color: var(--pink); }
  .logo span:nth-child(5) { color: var(--purple); }
  .logo span:nth-child(6) { color: var(--accent); }
  .logo span:nth-child(7) { color: var(--yellow); }
  .logo span:nth-child(8) { color: var(--green); }

  header p {
    color: var(--muted);
    font-size: 1.1rem;
    font-weight: 600;
    margin-top: 6px;
  }

  .main {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 24px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 24px 40px;
    position: relative;
    z-index: 1;
    align-items: start;
  }

  @media (max-width: 780px) {
    .main { grid-template-columns: 1fr; }
    .phone-col { display: flex; justify-content: center; }
  }

  /* ── LEFT PANEL ── */
  .left-col { display: flex; flex-direction: column; gap: 20px; }

  .section-label {
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }

  /* Scenario picker */
  .scenario-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .scenario-btn {
    border: 2px solid transparent;
    background: var(--card);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s;
    display: flex; align-items: center; gap: 6px;
  }
  .scenario-btn:hover { transform: translateY(-2px); border-color: var(--yellow); }
  .scenario-btn.active { border-color: var(--yellow); background: #2e2b10; color: var(--yellow); }

  /* Code editor */
  .editor-card {
    background: var(--panel);
    border-radius: var(--radius);
    border: 1.5px solid #2e2d4e;
    overflow: hidden;
  }

  .editor-topbar {
    background: #13122a;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid #2e2d4e;
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot-r { background: #ff5f57; }
  .dot-y { background: #febc2e; }
  .dot-g { background: #28c840; }
  .editor-title {
    margin-left: 8px;
    font-family: 'Space Mono', monospace;
    font-size: 0.78rem;
    color: var(--muted);
  }

  #codeArea {
    width: 100%;
    min-height: 220px;
    background: transparent;
    border: none;
    outline: none;
    color: #e8e6ff;
    font-family: 'Space Mono', monospace;
    font-size: 0.92rem;
    line-height: 1.7;
    padding: 20px;
    resize: vertical;
    tab-size: 4;
  }

  /* Hints */
  .hints {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .hint-row {
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 0.88rem; color: var(--muted); font-weight: 600;
  }
  .hint-row .tag {
    background: #2e2d4e;
    border-radius: 6px;
    padding: 1px 8px;
    font-family: 'Space Mono', monospace;
    font-size: 0.78rem;
    color: var(--blue);
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* Run button */
  .run-btn {
    background: linear-gradient(135deg, var(--green), #38e07f);
    color: #0a1a0f;
    border: none;
    padding: 14px 32px;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.1rem;
    font-weight: 900;
    cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    transition: all .2s;
    box-shadow: 0 4px 20px #6bff9e44;
    align-self: flex-start;
  }
  .run-btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 8px 30px #6bff9e66; }
  .run-btn:active { transform: scale(0.97); }
  .run-btn .icon { font-size: 1.3rem; }

  /* Output console */
  .console {
    background: #0b0b1a;
    border-radius: var(--radius);
    border: 1.5px solid #2e2d4e;
    padding: 16px 20px;
    min-height: 80px;
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    line-height: 1.7;
    color: var(--green);
  }
  .console .err { color: var(--accent); }
  .console .info { color: var(--muted); }

  /* ── PHONE ── */
  .phone-col { position: sticky; top: 20px; }

  .phone-wrap {
    position: relative;
    width: var(--phone-w);
  }

  .phone-outer {
    width: var(--phone-w);
    height: var(--phone-h);
    background: #1a1a2e;
    border-radius: 40px;
    border: 3px solid #3a3a5e;
    box-shadow:
      0 0 0 1px #5a5a8e,
      0 30px 80px #00000088,
      inset 0 0 30px #ffffff08;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .phone-notch {
    width: 90px; height: 24px;
    background: #0f0e17;
    border-radius: 0 0 20px 20px;
    margin: 0 auto;
    position: relative;
    z-index: 10;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .notch-cam { width: 8px; height: 8px; background: #2a2a4e; border-radius: 50%; border: 1px solid #3a3a6e; }
  .notch-speaker { width: 36px; height: 5px; background: #2a2a4e; border-radius: 3px; }

  .phone-status {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 16px 0;
    font-size: 0.65rem;
    font-weight: 700;
    color: #888;
    flex-shrink: 0;
  }

  .phone-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    position: relative;
    overflow: hidden;
    transition: background 0.6s ease;
  }

  /* Home button */
  .phone-home {
    width: 44px; height: 44px;
    background: #2a2a4e;
    border-radius: 50%;
    margin: 8px auto;
    border: 2px solid #3a3a6e;
    flex-shrink: 0;
  }

  /* Phone states */
  .phone-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
    width: 100%;
  }
  @keyframes popIn {
    from { transform: scale(0.5); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  .phone-emoji { font-size: 4rem; line-height: 1; }
  .phone-msg {
    font-size: 0.82rem;
    font-weight: 800;
    text-align: center;
    color: #fff;
    text-shadow: 0 2px 8px #00000088;
    padding: 0 8px;
  }
  .phone-sub {
    font-size: 0.7rem;
    font-weight: 600;
    text-align: center;
    opacity: 0.75;
    padding: 0 8px;
  }

  /* battery bar */
  .battery-visual {
    width: 100px; height: 18px;
    background: #1a1a2e;
    border-radius: 4px;
    border: 2px solid #3a3a5e;
    position: relative;
    overflow: hidden;
    margin-top: 4px;
  }
  .battery-fill {
    height: 100%;
    border-radius: 3px;
    transition: width .6s ease, background .6s ease;
  }
  .battery-tip {
    position: absolute;
    right: -7px; top: 50%;
    transform: translateY(-50%);
    width: 5px; height: 10px;
    background: #3a3a5e;
    border-radius: 0 2px 2px 0;
  }

  /* wifi bars */
  .wifi-bars { display: flex; align-items: flex-end; gap: 3px; margin-top: 4px; }
  .wifi-bar {
    width: 10px;
    background: #3a3a5e;
    border-radius: 2px;
    transition: background .4s, height .4s;
  }
  .wifi-bar.on { background: var(--green); }

  /* notification bubble */
  .notif-bubble {
    background: #fff;
    color: #1a1a2e;
    border-radius: 14px;
    padding: 8px 14px;
    width: 90%;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 16px #00000055;
    font-size: 0.75rem;
    font-weight: 700;
  }
  .notif-icon { font-size: 1.4rem; }
  .notif-text { display: flex; flex-direction: column; }
  .notif-title { font-weight: 900; font-size: 0.72rem; color: #1a1a2e; }
  .notif-body  { font-weight: 600; font-size: 0.68rem; color: #555; margin-top: 1px; }

  /* alarm pulse */
  @keyframes alarmPulse {
    0%,100% { box-shadow: 0 0 0 0 var(--accent); }
    50% { box-shadow: 0 0 0 18px transparent; }
  }
  .alarm-ring {
    width: 90px; height: 90px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem;
    animation: alarmPulse 1s ease-in-out infinite;
  }

  /* idle screen */
  .idle-clock {
    font-size: 3rem;
    font-weight: 900;
    font-family: 'Space Mono', monospace;
    color: #fff;
    opacity: 0.9;
  }
  .idle-date {
    font-size: 0.8rem;
    font-weight: 700;
    color: #aaa;
    margin-top: 4px;
  }

  /* variable sliders section */
  .vars-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .var-row { display: flex; flex-direction: column; gap: 4px; }
  .var-label {
    display: flex; justify-content: space-between;
    font-size: 0.85rem; font-weight: 800;
  }
  .var-label span:first-child { color: var(--purple); font-family: 'Space Mono', monospace; }
  .var-label span:last-child  { color: var(--yellow); }

  input[type=range] {
    width: 100%;
    accent-color: var(--purple);
    cursor: pointer;
  }

  /* Confetti burst */
  .confetti-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 9999;
    overflow: hidden;
  }
  .confetti-piece {
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 2px;
    animation: confettiFall 1.5s ease-in forwards;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* Tabs */
  .tabs { display: flex; gap: 8px; }
  .tab {
    padding: 8px 18px;
    border-radius: 50px;
    border: 2px solid #2e2d4e;
    background: transparent;
    color: var(--muted);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all .2s;
  }
  .tab.active { background: var(--blue); border-color: var(--blue); color: #0a1520; }
</style>
</head>
<body>

<div class="confetti-container" id="confetti"></div>

<header>
  <div class="logo">
    <span>C</span><span>o</span><span>d</span><span>e</span><span>K</span><span>i</span><span>d</span><span>s</span>
  </div>
  <p>🚀 Write code → Watch your phone react in real time!</p>
</header>

<div class="main">
  <div class="left-col">

    <!-- Scenario Picker -->
    <div>
      <div class="section-label">🎯 Choose a Scenario</div>
      <div class="scenario-grid" id="scenarioPicker"></div>
    </div>

    <!-- Variable Sliders -->
    <div>
      <div class="section-label">🎛️ Set Your Variables</div>
      <div class="vars-card" id="sliderArea"></div>
    </div>

    <!-- Code Editor -->
    <div>
      <div class="section-label">✍️ Write Your Python Code</div>
      <div class="editor-card">
        <div class="editor-topbar">
          <div class="dot dot-r"></div>
          <div class="dot dot-y"></div>
          <div class="dot dot-g"></div>
          <span class="editor-title">main.py</span>
        </div>
        <textarea id="codeArea" spellcheck="false"></textarea>
      </div>
    </div>

    <!-- Hints -->
    <div class="hints" id="hintsBox"></div>

    <!-- Run -->
    <button class="run-btn" onclick="runCode()">
      <span class="icon">▶</span> Run Code!
    </button>

    <!-- Console -->
    <div>
      <div class="section-label">📋 Output Console</div>
      <div class="console" id="consoleOut"><span class="info"># Your print() output will appear here...</span></div>
    </div>

  </div>

  <!-- Phone -->
  <div class="phone-col">
    <div class="section-label" style="text-align:center; margin-bottom:12px;">📱 Your Phone</div>
    <div class="phone-wrap">
      <div class="phone-outer">
        <div class="phone-notch">
          <div class="notch-cam"></div>
          <div class="notch-speaker"></div>
          <div class="notch-cam"></div>
        </div>
        <div class="phone-status">
          <span id="phoneTime">12:00</span>
          <span>📶 🔋</span>
        </div>
        <div class="phone-screen" id="phoneScreen">
          <div class="phone-state" id="phoneState">
            <div class="phone-emoji">📱</div>
            <div class="phone-msg">Write some code<br>and press Run!</div>
            <div class="phone-sub">Pick a scenario above to get started 👆</div>
          </div>
        </div>
        <div class="phone-home"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ── SCENARIOS ──────────────────────────────────────────────────────────────
const SCENARIOS = [
  {
    id: 'battery',
    label: '🔋 Battery',
    vars: [
      { name: 'battery', label: 'Battery %', min: 0, max: 100, default: 20 }
    ],
    code: `battery = {battery}

if battery == 0:
    print("Phone is OFF!")
elif battery < 10:
    print("CRITICAL! Plug in now!")
elif battery < 30:
    print("Battery is low, charge me!")
elif battery < 70:
    print("Battery is okay.")
else:
    print("Battery is full. Great!")`,
    hints: [
      { tag: 'if battery < 10:', text: 'Checks if battery is less than 10%' },
      { tag: 'elif', text: '"else if" — another condition to check' },
      { tag: 'else:', text: 'Runs when none of the above matched' },
    ]
  },
  {
    id: 'wifi',
    label: '📶 WiFi',
    vars: [
      { name: 'signal', label: 'WiFi Signal', min: 0, max: 100, default: 60 }
    ],
    code: `signal = {signal}

if signal == 0:
    print("No WiFi! You are offline.")
elif signal < 25:
    print("Very weak signal!")
elif signal < 60:
    print("Signal is okay, but slow.")
else:
    print("Great WiFi! Full bars!")`,
    hints: [
      { tag: 'signal == 0', text: '== checks if two values are equal' },
      { tag: 'signal < 25', text: '< means "less than"' },
    ]
  },
  {
    id: 'alarm',
    label: '⏰ Alarm',
    vars: [
      { name: 'hour', label: 'Current Hour (0–23)', min: 0, max: 23, default: 7 }
    ],
    code: `hour = {hour}

if hour == 7:
    print("WAKE UP! Alarm is ringing!")
elif hour < 7:
    print("Still sleeping... Zzz")
elif hour < 9:
    print("Morning! You're on time.")
else:
    print("You're late! Hurry!")`,
    hints: [
      { tag: 'hour == 7', text: 'True only when hour is exactly 7' },
      { tag: 'hour < 7', text: 'True when hour is 0, 1, 2, 3, 4, 5 or 6' },
    ]
  },
  {
    id: 'messages',
    label: '💬 Messages',
    vars: [
      { name: 'messages', label: 'Unread Messages', min: 0, max: 99, default: 5 }
    ],
    code: `messages = {messages}

if messages == 0:
    print("No new messages.")
elif messages == 1:
    print("You have 1 new message!")
elif messages < 10:
    print("A few messages waiting!")
else:
    print("Whoa! Lots of messages!")`,
    hints: [
      { tag: 'messages == 1', text: 'Exact match: only true for 1' },
      { tag: 'messages < 10', text: 'True for 2, 3, 4, 5, 6, 7, 8, 9' },
    ]
  },
  {
    id: 'storage',
    label: '💾 Storage',
    vars: [
      { name: 'free_gb', label: 'Free Storage (GB)', min: 0, max: 128, default: 10 }
    ],
    code: `free_gb = {free_gb}

if free_gb == 0:
    print("Storage FULL! Delete something!")
elif free_gb < 5:
    print("Almost full! Be careful.")
elif free_gb < 20:
    print("Some space left.")
else:
    print("Plenty of storage!")`,
    hints: [
      { tag: 'free_gb == 0', text: 'Checks for exactly zero gigabytes' },
      { tag: 'free_gb < 5', text: 'Matches 1, 2, 3, or 4 GB' },
    ]
  },
];

// ── STATE ──────────────────────────────────────────────────────────────────
let currentScenario = SCENARIOS[0];
let varValues = {};

// ── INIT ──────────────────────────────────────────────────────────────────
function init() {
  buildScenarioPicker();
  selectScenario(SCENARIOS[0]);
  updateClock();
  setInterval(updateClock, 1000);
}

function buildScenarioPicker() {
  const el = document.getElementById('scenarioPicker');
  el.innerHTML = '';
  SCENARIOS.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'scenario-btn' + (s.id === currentScenario.id ? ' active' : '');
    btn.textContent = s.label;
    btn.onclick = () => selectScenario(s);
    el.appendChild(btn);
  });
}

function selectScenario(s) {
  currentScenario = s;
  // reset var values
  varValues = {};
  s.vars.forEach(v => { varValues[v.name] = v.default; });

  buildScenarioPicker();
  buildSliders();
  buildHints();
  updateCodeFromSliders();
  resetPhone();
}

function buildSliders() {
  const el = document.getElementById('sliderArea');
  el.innerHTML = '';
  currentScenario.vars.forEach(v => {
    const row = document.createElement('div');
    row.className = 'var-row';
    row.innerHTML = `
      <div class="var-label">
        <span>${v.name}</span>
        <span id="val_${v.name}">${varValues[v.name]}</span>
      </div>
      <input type="range" min="${v.min}" max="${v.max}" value="${varValues[v.name]}"
        oninput="updateVar('${v.name}', this.value)">
    `;
    el.appendChild(row);
  });
}

function updateVar(name, val) {
  varValues[name] = parseInt(val);
  document.getElementById('val_' + name).textContent = val;
  updateCodeFromSliders();
}

function updateCodeFromSliders() {
  let code = currentScenario.code;
  currentScenario.vars.forEach(v => {
    code = code.replaceAll(`{${v.name}}`, varValues[v.name]);
  });
  document.getElementById('codeArea').value = code;
}

function buildHints() {
  const el = document.getElementById('hintsBox');
  el.innerHTML = `<div class="section-label">💡 Hints</div>` +
    currentScenario.hints.map(h =>
      `<div class="hint-row"><span class="tag">${h.tag}</span><span>${h.text}</span></div>`
    ).join('');
}

// ── RUN CODE ──────────────────────────────────────────────────────────────
function runCode() {
  const code = document.getElementById('codeArea').value;
  const consoleEl = document.getElementById('consoleOut');

  try {
    const result = interpretPython(code);
    consoleEl.innerHTML = result.output.map(line =>
      `<span style="color:var(--green)">&gt; ${escHtml(line)}</span>`
    ).join('<br>') || '<span class="info"># No output</span>';

    updatePhone(result);
    if (result.output.length > 0) burst();
  } catch(e) {
    consoleEl.innerHTML = `<span class="err">❌ Error: ${escHtml(e.message)}</span>`;
  }
}

// ── SIMPLE PYTHON INTERPRETER ─────────────────────────────────────────────
function interpretPython(code) {
  const env = {};
  const output = [];
  const lines = code.split('\n');
  let i = 0;

  function evalExpr(expr) {
    expr = expr.trim();
    // Replace variable names
    let evaled = expr.replace(/\b([a-zA-Z_][a-zA-Z0-9_]*)\b/g, (m) => {
      if (m in env) return env[m];
      return m;
    });
    // Safe eval of simple arithmetic/comparison
    try {
      // eslint-disable-next-line no-new-func
      return Function('"use strict"; return (' + evaled + ')')();
    } catch(e) { throw new Error('Cannot evaluate: ' + expr); }
  }

  function execBlock(lines, startIdx, indent) {
    let i = startIdx;
    while (i < lines.length) {
      const raw = lines[i];
      if (raw.trim() === '' || raw.trim().startsWith('#')) { i++; continue; }
      const lineIndent = raw.match(/^(\s*)/)[1].length;
      if (lineIndent < indent) break;

      const line = raw.trim();

      // Assignment: name = value
      const assign = line.match(/^([a-zA-Z_][a-zA-Z0-9_]*)\s*=\s*(.+)$/);
      if (assign && !line.startsWith('if') && !line.startsWith('elif') && !line.startsWith('else')) {
        env[assign[1]] = evalExpr(assign[2]);
        i++; continue;
      }

      // print(...)
      const pr = line.match(/^print\s*\(\s*(.*)\s*\)$/);
      if (pr) {
        let arg = pr[1].trim();
        // Strip quotes for strings
        if ((arg.startsWith('"') && arg.endsWith('"')) ||
            (arg.startsWith("'") && arg.endsWith("'"))) {
          output.push(arg.slice(1,-1));
        } else {
          output.push(String(evalExpr(arg)));
        }
        i++; continue;
      }

      // if / elif / else chain
      if (line.startsWith('if ') || line.startsWith('elif ') || line === 'else:') {
        let chainStart = i;
        // Build chain
        let chain = [];
        let j = i;
        while (j < lines.length) {
          const l = lines[j].trim();
          if (l === '' || l.startsWith('#')) { j++; continue; }
          const jIndent = lines[j].match(/^(\s*)/)[1].length;
          if (jIndent < indent && j > chainStart) break;

          if (l.startsWith('if ') || l.startsWith('elif ') || l === 'else:') {
            const cond = l === 'else:' ? null : l.replace(/^(if|elif)\s+/, '').replace(/:$/, '');
            chain.push({ cond, bodyStart: j + 1 });
          } else if (chain.length > 0) {
            // body line — skip
          }
          // advance
          if (l.startsWith('if ') || l.startsWith('elif ') || l === 'else:') {
            j++;
            // collect body
            chain[chain.length-1].bodyEnd = null;
            let jj = j;
            while (jj < lines.length) {
              const bl = lines[jj];
              if (bl.trim() === '') { jj++; continue; }
              const bInd = bl.match(/^(\s*)/)[1].length;
              if (bInd <= indent) break;
              jj++;
            }
            chain[chain.length-1].bodyEnd = jj;
            j = jj;
            // peek ahead for elif/else at same indent
            let k = jj;
            while (k < lines.length && lines[k].trim() === '') k++;
            if (k < lines.length) {
              const kInd = lines[k].match(/^(\s*)/)[1].length;
              const kl = lines[k].trim();
              if (kInd === indent && (kl.startsWith('elif ') || kl === 'else:')) {
                continue; // keep going in while(j)
              }
            }
            break;
          } else { j++; }
        }

        // Execute first true branch
        for (const branch of chain) {
          let condTrue = false;
          if (branch.cond === null) { condTrue = true; }
          else { condTrue = evalExpr(branch.cond); }
          if (condTrue) {
            execBlock(lines, branch.bodyStart, indent + 4);
            break;
          }
        }
        // Move i past whole chain
        const last = chain[chain.length - 1];
        i = last.bodyEnd || (last.bodyStart + 1);
        continue;
      }

      i++;
    }
    return i;
  }

  execBlock(lines, 0, 0);
  return { output, env };
}

// ── PHONE RENDERER ────────────────────────────────────────────────────────
function resetPhone() {
  const screen = document.getElementById('phoneScreen');
  screen.style.background = 'linear-gradient(160deg, #1a1930 0%, #0f0e17 100%)';
  document.getElementById('phoneState').outerHTML = `<div class="phone-state" id="phoneState">
    <div class="phone-emoji">📱</div>
    <div class="phone-msg">Write some code<br>and press Run!</div>
    <div class="phone-sub">Pick a scenario above to get started 👆</div>
  </div>`;
}

function updatePhone(result) {
  const screen = document.getElementById('phoneScreen');
  const stateEl = document.getElementById('phoneState');
  const output = result.output.join(' ').toLowerCase();
  const env = result.env;
  const sid = currentScenario.id;

  let html = '';
  let bg = 'linear-gradient(160deg, #1a1930 0%, #0f0e17 100%)';

  if (sid === 'battery') {
    const bat = env.battery ?? 0;
    const pct = Math.max(0, Math.min(100, bat));
    const color = pct < 10 ? '#ff4444' : pct < 30 ? '#ffaa00' : '#6bff9e';
    let emoji = '🔋', msg = '', sub = '';
    if (pct === 0)    { emoji='⚫'; msg='Phone Off'; sub='0% — No power!'; bg='#0a0a0a'; }
    else if (pct<10) { emoji='🪫'; msg='CRITICAL!'; sub='Plug in NOW!'; bg='linear-gradient(160deg,#3a0a0a,#1a0505)'; }
    else if (pct<30) { emoji='⚠️'; msg='Low Battery'; sub=`${pct}% remaining`; bg='linear-gradient(160deg,#2a1a00,#1a0f00)'; }
    else if (pct<70) { emoji='🔋'; msg='Charging Okay'; sub=`${pct}% — Looking good`; bg='linear-gradient(160deg,#0a1a2a,#0a0f1a)'; }
    else             { emoji='⚡'; msg='Fully Charged!'; sub=`${pct}% — Amazing!`; bg='linear-gradient(160deg,#0a2a15,#051a0a)'; }

    html = `
      <div class="phone-state" id="phoneState">
        <div class="phone-emoji">${emoji}</div>
        <div class="phone-msg">${msg}</div>
        <div style="position:relative;display:inline-block;margin-top:6px;">
          <div class="battery-visual" style="width:120px;height:22px;">
            <div class="battery-fill" style="width:${pct}%;background:${color};"></div>
          </div>
          <div class="battery-tip"></div>
        </div>
        <div class="phone-sub">${sub}</div>
        <div class="notif-bubble" style="margin-top:10px;">
          <div class="notif-icon">${emoji}</div>
          <div class="notif-text">
            <div class="notif-title">Battery</div>
            <div class="notif-body">${result.output[0] || ''}</div>
          </div>
        </div>
      </div>`;

  } else if (sid === 'wifi') {
    const sig = env.signal ?? 0;
    let bars = sig < 1 ? 0 : sig < 25 ? 1 : sig < 60 ? 2 : sig < 85 ? 3 : 4;
    const barH = [8, 14, 20, 26];
    let emoji = bars === 0 ? '❌' : '📶';
    let msg = result.output[0] || '';
    bg = bars === 0 ? 'linear-gradient(160deg,#1a0a0a,#0f0505)' :
         bars < 3 ? 'linear-gradient(160deg,#1a1500,#0f0e00)' :
         'linear-gradient(160deg,#0a1a0f,#051005)';

    const wifiBars = barH.map((h, idx) =>
      `<div class="wifi-bar ${idx < bars ? 'on' : ''}" style="height:${h}px;"></div>`
    ).join('');

    html = `
      <div class="phone-state" id="phoneState">
        <div class="phone-emoji">${emoji}</div>
        <div class="wifi-bars">${wifiBars}</div>
        <div class="phone-msg" style="margin-top:8px;">${msg}</div>
        <div class="phone-sub">Signal: ${sig}%</div>
      </div>`;

  } else if (sid === 'alarm') {
    const hour = env.hour ?? 0;
    const isRinging = hour === 7;
    bg = isRinging
      ? 'linear-gradient(160deg,#2a0a1a,#1a0510)'
      : 'linear-gradient(160deg,#0a0a2a,#05050f)';

    const displayH = hour % 12 || 12;
    const ampm = hour < 12 ? 'AM' : 'PM';
    const timeStr = `${displayH}:00 ${ampm}`;

    html = isRinging ? `
      <div class="phone-state" id="phoneState">
        <div class="alarm-ring" style="background:#2a0a1a;border:3px solid var(--accent);">⏰</div>
        <div class="phone-msg" style="color:var(--accent);font-size:1rem;">WAKE UP!!</div>
        <div class="phone-sub">Alarm ringing at ${timeStr}</div>
        <div class="notif-bubble" style="margin-top:8px;background:#fff0f5;">
          <div class="notif-icon">⏰</div>
          <div class="notif-text">
            <div class="notif-title">Alarm</div>
            <div class="notif-body">${result.output[0] || ''}</div>
          </div>
        </div>
      </div>` : `
      <div class="phone-state" id="phoneState">
        <div class="idle-clock">${timeStr}</div>
        <div class="idle-date">Current hour: ${hour}</div>
        <div class="phone-sub" style="margin-top:12px;">${result.output[0] || ''}</div>
      </div>`;

  } else if (sid === 'messages') {
    const msgs = env.messages ?? 0;
    bg = msgs > 0
      ? 'linear-gradient(160deg,#0a1a2a,#05100f)'
      : 'linear-gradient(160deg,#1a1930,#0f0e17)';

    const badge = msgs > 0
      ? `<div style="background:var(--accent);color:#fff;font-size:0.8rem;font-weight:900;
           width:28px;height:28px;border-radius:50%;display:flex;align-items:center;
           justify-content:center;position:absolute;top:-6px;right:-6px;">${msgs>99?'99+':msgs}</div>` : '';

    html = `
      <div class="phone-state" id="phoneState">
        <div style="position:relative;display:inline-block;">
          <div style="font-size:4rem;">💬</div>
          ${badge}
        </div>
        <div class="phone-msg">${result.output[0] || ''}</div>
        <div class="phone-sub">${msgs} unread message${msgs!==1?'s':''}</div>
        ${msgs > 0 ? `<div class="notif-bubble" style="margin-top:10px;">
          <div class="notif-icon">💬</div>
          <div class="notif-text">
            <div class="notif-title">Messages</div>
            <div class="notif-body">You have ${msgs} new message${msgs!==1?'s':''}!</div>
          </div>
        </div>` : ''}
      </div>`;

  } else if (sid === 'storage') {
    const gb = env.free_gb ?? 0;
    const totalGb = 128;
    const usedPct = Math.round(((totalGb - gb) / totalGb) * 100);
    const fillColor = gb === 0 ? '#ff4444' : gb < 5 ? '#ffaa00' : '#6bff9e';
    let emoji = gb === 0 ? '❌' : gb < 5 ? '⚠️' : '💾';
    bg = gb === 0 ? 'linear-gradient(160deg,#2a0a0a,#100505)' :
         gb < 5 ? 'linear-gradient(160deg,#1a1000,#0f0800)' :
         'linear-gradient(160deg,#0a1520,#050a10)';

    html = `
      <div class="phone-state" id="phoneState">
        <div class="phone-emoji">${emoji}</div>
        <div class="phone-msg">${result.output[0] || ''}</div>
        <div style="width:140px;background:#1a1a3a;border-radius:8px;height:14px;margin:8px 0;overflow:hidden;">
          <div style="width:${usedPct}%;height:100%;background:${fillColor};border-radius:8px;transition:width .6s;"></div>
        </div>
        <div class="phone-sub">${gb} GB free of ${totalGb} GB</div>
      </div>`;
  }

  screen.style.background = bg;
  stateEl.outerHTML = html;
}

// ── CLOCK ─────────────────────────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('phoneTime').textContent = `${h}:${m}`;
}

// ── CONFETTI ──────────────────────────────────────────────────────────────
function burst() {
  const container = document.getElementById('confetti');
  const colors = ['#ff6b6b','#6bff9e','#ffe66d','#6bc5ff','#c77dff','#ff6bbf'];
  for (let i = 0; i < 30; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.cssText = `
      left:${10 + Math.random()*80}%;
      top:-10px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      transform:rotate(${Math.random()*360}deg);
      animation-duration:${0.8+Math.random()*0.8}s;
      animation-delay:${Math.random()*0.3}s;
      width:${6+Math.random()*8}px;
      height:${6+Math.random()*8}px;
    `;
    container.appendChild(el);
    setTimeout(() => el.remove(), 2000);
  }
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Tab enter → indent
document.addEventListener('DOMContentLoaded', () => {
  init();
  document.getElementById('codeArea').addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = this.selectionStart;
      this.value = this.value.slice(0,s) + '    ' + this.value.slice(this.selectionEnd);
      this.selectionStart = this.selectionEnd = s + 4;
    }
  });
});
</script>
